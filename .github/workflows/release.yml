name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue-frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: build-installer.bat

      - name: Generate changelog
        id: changelog
        shell: powershell
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD~1 2>$null
          if ($LASTEXITCODE -ne 0) {
            $prevTag = ""
          }
          if ($prevTag) {
            $log = git log --oneline --format="- %s (%h)" "$prevTag..HEAD"
          } else {
            $log = git log --oneline --format="- %s (%h)" HEAD
          }
          $logContent = $log -join "`n"
          $body = "## What's New`n`n$logContent"
          $delimiter = "ghadelimiter_$(Get-Random)"
          "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: installer/output/Coiner-Setup-*.exe
          draft: false
          prerelease: false
